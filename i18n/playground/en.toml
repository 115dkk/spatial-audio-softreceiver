tips = [
  "Press Ctrl+K to open the command palette. Press it again to close it. Press it twice and it is as if nothing ever happened.",
  "This is one of 50 tips. The other 49 are about this good.",
  "Sound travels through air at about 343 metres per second. You cannot change this in Settings.",
  "48 kHz means 48,000 samples every second. You don't need to count them.",
  "Headphones work best on your ears. Around your neck, the volume drops considerably.",
  "Turning the engine off turns the engine off.",
  "At 0 dB the volume is not changed. It is our most honest setting.",
  "This screen scrolls. There is more below. Once you are down there, there is more above too.",
  "7.1.4 is 12 channels. You can verify this by adding 7, 1 and 4 yourself.",
  "Dismiss this tip and the next one appears. The only way out of the tips is another skin.",
  "In dark mode, the screen is dark.",
  "The decibel is a logarithmic unit. Adding 6 dB roughly doubles the amplitude. Relations with your neighbours are not measured in dB.",
  "The Windows key opens the Start menu. That has nothing to do with this app.",
  "Zero dropouts means it did not drop out.",
  "This app has exactly one workspace. To invite a teammate, bring another chair.",
  "In 12 ms of latency, sound travels about 4 metres through air. That sound is still inside your PC, though, so it goes nowhere.",
  "BRIR stands for Binaural Room Impulse Response. Without the abbreviation, it is long.",
  "Rolling the mouse wheel moves the screen. Rolling it the other way moves it the other way.",
  "Today is yesterday's tomorrow. The uptime history shows the last 90 minutes of it.",
  "Muting makes it quiet. This feature is not PRO.",
  "Human ears usually hear from 20 Hz to 20 kHz. With age, the top goes first. No update can fix that.",
  "If this tip took you 3 seconds to read, 144,000 samples went by at 48 kHz in the meantime.",
  "Without an output device there is no sound. With an output device that is switched off, also no sound.",
  "A clock correction of 37.5 ppm means 37.5 parts per million. Over a day, that is about 3.2 seconds.",
  "PCM is uncompressed sound. It is big because it is not compressed.",
  "Type \"breather\" in the command palette to find Take a breather. The button at the top right is faster.",
  "Every number on this screen is real. The only exaggeration is this line's exclamation mark!",
  "Restarting your PC fixes many problems. This tip fixes none.",
  "An uptime of 100.0% may be 99.95% or more, rounded.",
  "A subwoofer plays the bass. It is written as .1 of a channel, but it is not a tenth of a speaker.",
  "Tab moves the focus to the next item. Shift+Tab moves it back. This is true in most apps.",
  "Turn on \"Start at sign-in\" and the app starts at sign-in.",
  "Stereo has 2 channels. You have 2 ears. This is not a coincidence.",
  "This skin has the same features as the Legit Playground skin. Sentences like this one are the only difference.",
  "Giving 5 stars adds no features. Giving 1 star removes none.",
  "An unplugged cable does not connect. It is also the first thing customer support asks about.",
  "A minute has 60 seconds. That is why the \"Last 60 seconds\" traces show exactly one minute.",
  "Closing the window leaves the app in the tray. If you closed the window and still hear sound, that is why.",
  "96 kHz is twice 48 kHz. Whether it sounds twice as good depends on who you ask.",
  "Settings are saved the moment you change them. That is why there is no Save button.",
  "Tips are picked at random. The same tip never comes twice in a row, so if you miss the last one, you will have to wait a little.",
  "DD+ with 6 channels is 5.1. 5 plus 1 is 6.",
  "Change the skin and these tips go away. We will not stop you.",
  "Buying the developer a meal does not lower the latency. It only shortens the time the developer goes hungry.",
  "On the sound map, up is front. Rotate your monitor and up on the map is still front.",
  "Pink noise is not pink. White noise is not white either.",
  "The ms beside a number is milliseconds, thousandths of a second. With a capital M it would be megaseconds, about 11.6 days.",
  "ASIO buffer sizes must be powers of two: 64, 128, 256, 512, 1024, 2048. You don't need to memorise them.",
  "This app has no subscription fee. That is why there is no Cancel subscription button.",
  "When you turn off your computer, this app turns off too.",
]

