# Handwritten `unsafe` allowance per crate, counted as `unsafe` tokens in the
# crate's Rust sources (comments, strings and char literals excluded). Every
# crate not listed here has 0 and must carry `#![forbid(unsafe_code)]`.
# A listed crate carries `#![deny(unsafe_code)]` and its own `[lints.rust]`
# table instead. Raising a number requires an ADR (docs/adr) first.
[budget]
# Capture device IOCTLs, MMCSS and QPC through the `windows` crate (ADR 0002),
# and the Windows Host adapter: registry, code integrity, cfgmgr32 device
# nodes, endpoint topology, the exclusive-mode policy read from the endpoint
# property stores, IPolicyConfig and the elevated ssr-setup launch (ADR 0032,
# which allows up to 40).
# Kernel streaming output (ADR 0037, 74): endpoint visibility through
# IPolicyConfig, KS filter and pin discovery, pin creation, WaveRT and
# standard streaming I/O, and console cancellation. Per-app entrances
# (ADR 0038, 107): audio session enumeration, process image names and the
# private IAudioPolicyConfigFactory activation and calls.
ssr-sys = 107
# The administrator tasks of ssr-setup (ADR 0032): COM endpoint enumeration
# and the exclusive-mode property store, cfgmgr32 device nodes, SetupAPI root
# device install and removal, the local machine certificate stores, and the
# registry (driver parameter, service keys, endpoint entries), each call in
# one wrapper in `win.rs`.
ssr-setup-sys = 52
# Plugin isolation: previous 84 + VST 3 module/COM calls and host callbacks (98),
# less the temporary ring producer (1) that streamring's owned Publisher and
# `RegionMemory for SharedRegion` replaced.
# Part B budget; lead records the ADR 0022 addendum at integration.
plughost-sys = 181
# Test only: VST 2 (22) + VST 3 factory, component/controller/view and buffers (104).
plughost-testplugin = 126
