[package]
name = "asio-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later AND GPL-3.0-only"
repository.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
dbg_macro = "deny"

[dependencies]
inventory = "0.3"
asio-proto.workspace = true
streamring.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Threading", "Win32_System_Registry", "Win32_System_Memory", "Win32_System_Performance", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_Media_Audio"] }

[features]
probe = []
