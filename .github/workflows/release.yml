name: Release

# Publishes a release from every push to master that changes a shipped file
# (ADR 0017). Versions are plain v<major>.<minor>.<patch>; while the major
# version is 0 every release is a GitHub prerelease and never takes the
# "latest" spot.
#
#   gate           .github/scripts/release_gate.py: release the workspace
#                  version if it has no tag yet; otherwise, when shipped files
#                  changed since its tag, bump it (feat: minor, else patch),
#                  commit the bump to master as github-actions[bot] and release
#                  that.
#   build-windows  tests in release mode, then the developer tools, zipped:
#                  ssr-replay, and ssr-live for a tester's SAL PC (ADR 0018)
#   build-linux    the same for Linux (ssr-replay runs in Linux CI)
#   driver-kit     the kernel driver (Release x64) test-signed into the kit a
#                  tester installs on a test-signing PC
#                  (tools/ci/driver-test-kit.ps1; the certificate's private key
#                  never leaves the runner). driver.yml installs, uses and
#                  uninstalls the same kit on every pull request
#   publish        SHA256SUMS.txt, notes from the commit subjects, and the
#                  release itself (assets replaced when the tag exists)
#
# Every job checks out release_sha, the commit the gate decided on (the bump
# commit when it bumped), so a push that lands meanwhile cannot slip in. The
# bump is pushed over SSH with the RELEASE_DEPLOY_KEY deploy key, which
# master's "Required checks" ruleset lets through (the bump commit has no
# checks of its own, and GitHub does not accept GitHub Actions as a bypass
# actor on a personal repository); its message carries [skip ci], so it does
# not start this workflow or CI again. The build jobs restore and save no
# cache: whatever they compile cannot reach a cache another workflow on master
# would trust (CodeQL actions/cache-poisoning), and a release is rare enough
# to build cold.

# Push only. A manual dispatch would let any ref's code run in this workflow
# (CodeQL actions/cache-poisoning); a failed release is retried by re-running
# its run instead.
on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  gate:
    name: Release gate
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # The bump push authenticates with the deploy key, not the workflow token.
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.gate.outputs.should_release }}
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
      previous_tag: ${{ steps.gate.outputs.previous_tag }}
      release_sha: ${{ steps.gate.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Decide (and bump on master)
        id: gate
        run: python3 .github/scripts/release_gate.py

  build-windows:
    name: Windows tools
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.release_sha }}

      - uses: ./.github/actions/rust-toolchain

      # The app embeds the built screens at compile time, and the workspace
      # test compiles the app on Windows.
      - uses: ./.github/actions/ui-dist

      - name: Test (release mode)
        run: cargo test --workspace --release --locked

      - name: Build
        env:
          SSR_RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        # asio_probe loads an ASIO DLL as a DAW does; `ssr-live asio-probe`
        # runs it from beside ssr-live.exe (docs/testing/test-signed-pc.md).
        run: |
          cargo build --release --locked -p ssr-replay -p ssr-live
          cargo build --release --locked -p ssr-asio --features probe --example asio_probe

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($tool in 'ssr-replay', 'ssr-live') {
            $reported = & "target/release/$tool.exe" --version
            if ($reported -ne "$tool $env:VERSION") { throw "$tool reports '$reported'" }
          }
          $stage = "spatial-softreceiver-tools-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force "dist/$stage" | Out-Null
          Copy-Item target/release/ssr-replay.exe, target/release/ssr-live.exe, LICENSE, README.md "dist/$stage/"
          # asio_probe links asio-sys, so it is GPL-3.0 and carries the text (ADR 0025).
          Copy-Item target/release/examples/asio_probe.exe "dist/$stage/"
          Copy-Item crates/asio-sys/LICENSE "dist/$stage/LICENSE-GPL-3.0.txt"
          # Speaker profile examples (ADR 0030): a tester copies one and edits it.
          New-Item -ItemType Directory -Force "dist/$stage/profiles" | Out-Null
          Copy-Item docs/profiles/*.toml "dist/$stage/profiles/"
          Compress-Archive -Path "dist/$stage/*" -DestinationPath "dist/$stage.zip"
          Remove-Item -Recurse -Force "dist/$stage"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Linux tools
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.release_sha }}

      - uses: ./.github/actions/rust-toolchain

      - name: Test (release mode)
        run: cargo test --workspace --release --locked

      - name: Build
        env:
          SSR_RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: cargo build --release --locked -p ssr-replay

      - name: Package
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          reported="$(target/release/ssr-replay --version)"
          test "$reported" = "ssr-replay $VERSION" || { echo "binary reports '$reported'"; exit 1; }
          stage="spatial-softreceiver-tools-$VERSION-linux-x86_64"
          mkdir -p "dist/$stage"
          cp target/release/ssr-replay LICENSE README.md "dist/$stage/"
          tar -C dist -czf "dist/$stage.tar.gz" "$stage"
          rm -rf "dist/$stage"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  driver-kit:
    name: Driver test kit (x64, test-signed)
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.release_sha }}

      - name: Build the driver (Release x64) with the NuGet WDK, then InfVerif
        shell: pwsh
        run: ./tools/build-driver.ps1 -Configuration Release -Platform x64

      - name: Test-sign and package the kit (tools/ci/driver-test-kit.ps1)
        shell: pwsh
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: ./tools/ci/driver-test-kit.ps1 -Package target/driver/Release/x64 -Version $env:VERSION -OutDir dist

      - uses: actions/upload-artifact@v7
        with:
          name: driver-kit
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  app-installer:
    name: App installer (x64, Velopack)
    needs: [gate, driver-kit]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.release_sha }}

      - uses: ./.github/actions/rust-toolchain

      - uses: ./.github/actions/ui-dist

      # The test-signed driver package the app's wizard installs, and its
      # certificate, come from the kit this same release ships.
      - uses: actions/download-artifact@v8
        with:
          name: driver-kit
          path: kit

      - name: Build the app, the guard, the setup tool, the plugin host and the ASIO DLL
        run: cargo build --release --locked -p spatial-softreceiver --features spatial-softreceiver/updater -p ssr-guard -p ssr-setup -p ssr-plughost -p ssr-asio

      - name: Stage the app folder
        shell: pwsh
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem kit -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'no driver kit zip' }
          Expand-Archive $zip.FullName -DestinationPath kit/expanded
          $package = Get-ChildItem kit/expanded -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force stage/profiles | Out-Null
          # ssr-setup reads the INF and the certificate from the app's folder
          # (ssr_abi::setup_contract); the guard and the setup tool sit beside
          # the app (apps/spatial-softreceiver/src/paths.rs).
          foreach ($name in 'spatialsoftreceiver.sys', 'spatialsoftreceiver.inf', 'spatialsoftreceiver.cat', 'spatialsoftreceiver-test.cer', 'kit.json') {
            Copy-Item (Join-Path $package.FullName $name) stage/
          }
          Rename-Item stage/kit.json driver-kit.json
          # The plugin host runs each VST upmixer in its own process (ADR 0021);
          # the repository's test plugin is never staged.
          Copy-Item target/release/spatial-softreceiver.exe, target/release/ssr-guard.exe, target/release/ssr-setup.exe, target/release/ssr-plughost.exe, LICENSE stage/
          # ssr-setup copies the ASIO DLL from beside itself to Program Files
          # and registers it there (ADR 0025). The DLL links asio-sys, so it
          # is GPL-3.0 and the folder carries the text.
          Copy-Item target/release/ssrasio.dll stage/
          Copy-Item crates/asio-sys/LICENSE stage/LICENSE-GPL-3.0.txt
          # The toasts' icon (ssr_sys::toast::register reads it beside the app).
          Copy-Item apps/spatial-softreceiver/icons/icon.ico stage/spatial-softreceiver.ico
          Copy-Item docs/profiles/*.toml stage/profiles/
          $reported = & stage/ssr-setup.exe --version
          if ($reported -ne "ssr-setup $env:VERSION") { throw "ssr-setup reports '$reported'" }
          Get-ChildItem -Recurse stage | Format-Table FullName, Length

      - name: Install vpk
        run: dotnet tool install -g vpk

      # Velopack: Setup.exe installs under %LOCALAPPDATA%\SpatialSoftReceiver
      # with a Start Menu shortcut carrying the app's AUMID (the toasts use
      # it), and the app updates itself from these release assets
      # (releases.win.json and the nupkg; apps/spatial-softreceiver/src/update.rs).
      - name: Pack the installer (Velopack)
        shell: pwsh
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          vpk pack --packId SpatialSoftReceiver --packVersion $env:VERSION --packDir stage `
            --mainExe spatial-softreceiver.exe --packTitle 'Spatial SoftReceiver' --packAuthors 115dkk `
            --icon apps/spatial-softreceiver/icons/icon.ico --shortcuts StartMenuRoot `
            --aumid io.github.115dkk.spatial-softreceiver --noPortable --outputDir dist
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed ($LASTEXITCODE)" }
          $setup = Get-ChildItem dist -Filter '*Setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'vpk pack wrote no Setup.exe' }
          # A versioned name for people; the feed and the packages keep theirs.
          Rename-Item $setup.FullName "spatial-softreceiver-setup-$env:VERSION-x64.exe"
          if (-not (Test-Path dist/releases.win.json)) { throw 'vpk pack wrote no releases.win.json' }
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: [gate, build-windows, build-linux, driver-kit, app-installer]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.gate.outputs.tag }}
      VERSION: ${{ needs.gate.outputs.version }}
      PRERELEASE: ${{ needs.gate.outputs.prerelease }}
      PREVIOUS: ${{ needs.gate.outputs.previous_tag }}
      RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Checksums and notes
        run: |
          set -euo pipefail
          (cd release && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          range="$RELEASE_SHA"
          if [ -n "$PREVIOUS" ]; then range="$PREVIOUS..$RELEASE_SHA"; fi
          {
            echo "Built from ${RELEASE_SHA}."
            echo
            # The tester's summary: what to download, in which order, how to
            # send results. The guide link is pinned to this release's commit.
            guide="https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_SHA}/docs/testing/test-signed-pc.md"
            sed -e "s|{version}|${VERSION}|g" -e "s|{guide}|${guide}|g" .github/release-notes.md
            echo
            echo "## Changes"
            git log --no-merges --pretty=format:'- %s' "$range" | grep -v '^- chore(release): ' || true
            echo
          } > notes.md
          cat notes.md

      - name: Create or update the release
        run: |
          set -euo pipefail
          flags=(--latest)
          if [ "$PRERELEASE" = "true" ]; then flags=(--prerelease --latest=false); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --notes-file notes.md "${flags[@]}"
          else
            gh release create "$TAG" release/* --target "$RELEASE_SHA" \
              --title "Spatial SoftReceiver $VERSION" --notes-file notes.md "${flags[@]}"
          fi
          gh release view "$TAG" --json assets,isPrerelease -q '{prerelease: .isPrerelease, assets: [.assets[].name]}'
