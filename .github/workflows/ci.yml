name: CI

# Gates every pull request and every push to master (ADR 0002). The repository
# is public, so Actions minutes are not rationed: every job runs on every
# event, without path filters.
#
#   lint      fmt, clippy -D warnings (also for the x64 and ARM64 Windows
#             targets, so cfg(windows) code is linted from Linux), the
#             ssr-policy gates (forbid unsafe, unsafe budget, feature registry,
#             Windows code only in ssr-sys), the release gate's unit tests and
#             the CI tools' unit tests
#   ui        the app's screens (apps/spatial-softreceiver/ui): fonts pinned
#             by SHA-256, tsc, vitest, the generated TypeScript bindings and
#             snapshot fixtures compared with ssr-types (tests/ui_contract.rs),
#             and the screen gallery (every scene in Korean and English, light
#             and dark) as an artifact; ui-gallery.yml posts it to an issue
#   test      cargo test on Linux, Windows Server 2022 and 2025 (x64) and
#             Windows 11 (ARM64), debug and release; on Windows also the app
#             started for real (--smoke: WebView2 draws the screens and asks
#             for a snapshot); on x64 Windows also the generated driver header
#             compiled as C89, C11 and C++17
#   replay    the replay fixtures rendered twice (hashes must match) and,
#             on pull requests, against the base commit (reported, not failed)
#   audio     Windows Server 2022 and 2025 with a virtual audio cable
#             (VB-CABLE): the device tests ssr-sys keeps #[ignore]d, the live
#             path played into the cable and recorded back against ssr-replay's
#             offline render, and soaks (exclusive, shared, under CPU load and
#             under full page heap) that must end without faults, restarts or
#             underruns
#   plughost  Windows Server 2022 and 2025 (x64) and Windows 11 (ARM64): the
#             plugin host process (ssr-plughost) loads the repository's own
#             test plugin (plughost-testplugin, never shipped) as VST 2 and as
#             VST 3, and the #[ignore]d tests drive it end to end: processing
#             through the shared-memory ring, state, editor, crash, hang and
#             NaN (ADR 0021, 0035). On x64 it also loads a third-party VST 3
#             upmixer kept encrypted in tools/ci/private/, decrypted into the
#             runner's temp folder only when the secret is there; it is never
#             uploaded, cached or logged. Nothing is downloaded.
#   docs      rustdoc with warnings denied (broken intra-doc links included),
#             for Linux and for the Windows target
#   miri      the pure parsing crates under Miri
#   fuzz      every cargo-fuzz target for two minutes
#   coverage  llvm-cov line coverage, summarised on the run page
#   deny      cargo-deny: advisories, licenses, bans, sources
# The engine and everything below it build without Windows, which is why the
# Linux legs can run the replay tests at all.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: fmt + clippy + policy gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-toolchain
        with:
          cache-key: lint
          targets: x86_64-pc-windows-msvc aarch64-pc-windows-msvc

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The app embeds ui/dist at compile time (tauri::generate_context!), so
      # the screens are built before any Windows-target step; tauri-build also
      # compiles the app's Windows resource file, which needs llvm-rc here.
      - uses: ./.github/actions/ui-dist
      - uses: ./.github/actions/windows-cross-tools

      # Type-checking needs no linker, so the Windows targets are linted here
      # too; the cfg(windows) modules of ssr-sys, ssr-live and the app's shell
      # are otherwise compiled on Windows but never linted.
      - name: cargo clippy for Windows x64 and ARM64 (deny warnings)
        run: |
          for target in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            cargo clippy --workspace --all-targets --locked --target "$target" -- -D warnings
          done

      - name: Policy gates (crates/ssr-policy)
        run: cargo test -p ssr-policy --locked -- --nocapture

      - name: Release gate unit tests
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py" -v

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # SSR_TEST_PWSH runs the tests that compile the tools' inline C# and run
      # their PowerShell logic (endpoint lookup, exclusive-policy verdicts);
      # PowerShell 7 ships on the hosted images.
      - name: CI tool unit tests (tools/ci)
        env:
          SSR_TEST_PWSH: pwsh
        run: |
          python -m pip install --quiet -r tools/ci/requirements.txt
          python -m unittest discover -s tools/ci -p "test_*.py" -v

  ui:
    name: screens (tsc, vitest, contract, screenshots)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-toolchain
        with:
          cache-key: ui

      - uses: ./.github/actions/ui-dist

      - name: Type check and unit tests (apps/spatial-softreceiver/ui)
        working-directory: apps/spatial-softreceiver/ui
        run: |
          npm run check
          npm test

      # The bindings the screens compile against and the fixtures they are
      # tested with are generated from ssr-types; a type change without its
      # regenerated files fails here (SSR_UI_BLESS=1 regenerates them).
      - name: The committed bindings and fixtures match ssr-types (tests/ui_contract.rs)
        run: cargo test -p ssr-types --features ts --test ui_contract --locked

      # Every scene of ui/e2e/gallery.json in Korean and English, light and
      # dark: no console error, the font loaded, no sideways scroll and no
      # Hangul on an English screen. ui-gallery.yml takes the same pictures
      # and posts them to a review issue.
      - name: Gallery screenshots of every screen state (Playwright, Chromium)
        working-directory: apps/spatial-softreceiver/ui
        env:
          SSR_UI_SHOTS_DIR: ${{ runner.temp }}/ui-shots
        run: |
          npx playwright install --with-deps chromium
          npm run shots

      - name: The pictures match the scene table (tools/ui-gallery-issue.mjs)
        run: node tools/ui-gallery-issue.mjs --check --shots "$RUNNER_TEMP/ui-shots"

      - uses: actions/upload-artifact@v7
        with:
          name: ui-shots
          path: ${{ runner.temp }}/ui-shots
          if-no-files-found: error

  test:
    name: cargo test (${{ matrix.os }}, ${{ matrix.profile }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is Server 2025; windows-11-arm is the client OS on
        # ARM64, the only Windows 11 image GitHub hosts.
        os: [ubuntu-latest, windows-latest, windows-2022, windows-11-arm]
        profile: [debug, release]
    runs-on: ${{ matrix.os }}
    env:
      PROFILE_FLAG: ${{ matrix.profile == 'release' && '--release' || '' }}
      UPDATER_FLAG: ${{ startsWith(matrix.os, 'windows') && '--features spatial-softreceiver/updater' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-toolchain
        with:
          cache-key: test-${{ matrix.profile }}

      - uses: ./.github/actions/ui-dist

      # --no-fail-fast: one failing test binary must not hide the others,
      # many of which (ssr-sys, ssr-live platform) run only on Windows.
      - name: cargo test --workspace
        shell: bash
        # The app's updater (Velopack) is built only on the Windows runners:
        # its TLS stack does not cross-compile from Linux (ADR 0001 addendum).
        run: cargo test --workspace --all-targets --locked --no-fail-fast $PROFILE_FLAG $UPDATER_FLAG

      - name: cargo test --doc
        if: matrix.profile == 'debug'
        run: cargo test --workspace --doc --locked

      # The shell starts for real: WebView2 loads the built screens, the
      # screen asks for its first snapshot over the IPC and the app quits
      # with 0 (ADR 0001, 2026-10-15). Without the driver it shows the
      # wizard's first step, which is all the smoke needs.
      - name: The app starts, draws the screens and quits (--smoke)
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 10
        run: cargo run --locked -p spatial-softreceiver $PROFILE_FLAG $UPDATER_FLAG -- --smoke 90

      - name: Driver header compiles as C89, C11 and C++17 (MSVC)
        if: runner.os == 'Windows' && runner.arch == 'X64' && matrix.profile == 'debug'
        shell: pwsh
        run: ./tools/check-c-header.ps1

  replay:
    name: replay determinism (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/rust-toolchain
        with:
          cache-key: replay

      - name: Generate the fixtures (apps/ssr-replay/examples/replay_fixtures.rs)
        shell: bash
        run: cargo run --locked -q -p ssr-replay --example replay_fixtures -- "$RUNNER_TEMP/fx"

      - name: Render every dump twice with this commit; the hashes must match
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p ssr-replay
          bin=target/release/ssr-replay
          fx="$RUNNER_TEMP/fx"
          {
            echo "## Replay output (${{ matrix.os }})"
            echo
            echo "| dump | output_sha256 | blocks |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for d in pcm71 ddp51; do
            for run in 1 2; do
              "$bin" render "$fx/$d.ssrdump" --profile "$fx/profile.toml" \
                --out "$RUNNER_TEMP/$d-$run.wav" --report "$RUNNER_TEMP/$d-$run.json"
            done
            a=$(jq -r .output_sha256 "$RUNNER_TEMP/$d-1.json")
            b=$(jq -r .output_sha256 "$RUNNER_TEMP/$d-2.json")
            test "$(jq '.errors | length' "$RUNNER_TEMP/$d-1.json")" = 0
            if [ "$a" != "$b" ]; then echo "::error::$d renders differently on two runs: $a vs $b"; exit 1; fi
            echo "| $d | \`$a\` | $(jq .blocks "$RUNNER_TEMP/$d-1.json") |" >> "$GITHUB_STEP_SUMMARY"
          done

      # Output changes are allowed (a better renderer changes the bytes), so
      # this step reports instead of failing; the summary says which dumps
      # changed against the pull request's base commit.
      - name: Compare with the base commit
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          fx="$RUNNER_TEMP/fx"
          base="$RUNNER_TEMP/base"
          git worktree add --detach "$base" "$BASE_SHA"
          echo >> "$GITHUB_STEP_SUMMARY"
          if ! (cd "$base" && cargo build --release -q -p ssr-replay); then
            echo "Base ${BASE_SHA:0:12} does not build ssr-replay; nothing to compare." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base_bin="$base/target/release/ssr-replay"
          if ! "$base_bin" render --help > /dev/null 2>&1; then
            echo "Base ${BASE_SHA:0:12} has no render command; nothing to compare." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "| dump | against base ${BASE_SHA:0:12} |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for d in pcm71 ddp51; do
            head=$(jq -r .output_sha256 "$RUNNER_TEMP/$d-1.json")
            if "$base_bin" render "$fx/$d.ssrdump" --profile "$fx/profile.toml" \
                --out "$RUNNER_TEMP/$d-base.wav" --report "$RUNNER_TEMP/$d-base.json"; then
              old=$(jq -r .output_sha256 "$RUNNER_TEMP/$d-base.json")
              if [ "$old" = "$head" ]; then verdict="unchanged"; else verdict="**changed** (base \`$old\`)"; fi
            else
              verdict="base could not render it (input or profile format changed)"
            fi
            echo "| $d | $verdict |" >> "$GITHUB_STEP_SUMMARY"
          done

  # GitHub's Windows images have no sound device. VB-CABLE gives one render
  # endpoint ("Speakers (VB-Audio Virtual Cable)") whose signal comes back on a
  # capture endpoint ("CABLE Output"), so the live path can be heard by the
  # job itself (ADR 0026).
  audio:
    name: live audio (${{ matrix.os }}, VB-CABLE)
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Line tables in the PDBs, so a crash dump's stack names the source.
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-toolchain
        with:
          cache-key: audio

      # VB-CABLE, local crash dumps, the system timer held at 1 ms and MMCSS
      # running; the driver end-to-end job uses the same script (ADR 0026).
      # The cable keeps the driver's defaults (96 kHz, 7,168 samples): at 48 kHz
      # with a 6,144-sample pipe every Server 2022 soak lost real-time pace.
      - name: Real-time audio on the runner (tools/ci/realtime-audio.ps1)
        shell: pwsh
        run: ./tools/ci/realtime-audio.ps1 -CrashDumps (Join-Path $env:RUNNER_TEMP 'dumps')

      - name: Build ssr-live and ssr-replay; write the fixtures
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p ssr-live -p ssr-replay
          cargo run --locked --release -q -p ssr-replay --example replay_fixtures -- "$RUNNER_TEMP/fx"
          target/release/ssr-live.exe devices

      # The exclusive cadence tests run at a 20 ms period, longer than a PCM
      # block; exclusive_cadence_at_each_period prints the rate the sink
      # keeps at 3 to 40 ms (ADR 0026). no_alloc runs WASAPI periods (shared,
      # exclusive with a forced restart, and an exclusive multichannel layout
      # of the default endpoint) under the allocation guard.
      - name: Device tests ssr-sys keeps ignored (WASAPI exclusive and shared, MMCSS, SAL absent, no allocation)
        env:
          SSR_TEST_EXCLUSIVE_PERIOD_MS: "20"
        run: cargo test --locked --release -p ssr-sys --test windows --test no_alloc -- --ignored --test-threads=1 --nocapture

      # The stages below run even when an earlier one failed, so one CI round
      # reports on all of them; the job still fails.
      - uses: actions/setup-python@v7
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          python-version: "3.13"

      - name: Loopback (live output recorded back against the offline render)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet -r tools/ci/requirements.txt soundcard==0.4.5
          fx="$RUNNER_TEMP/fx"
          {
            echo "## Loopback (${{ matrix.os }})"
            echo
            echo "| dump | mode | windows | matched | resyncs | median | worst | underruns while streaming | restarts | reference at | first sound |"
            echo "| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          for d in pcm71 ddp51; do
            target/release/ssr-replay.exe render "$fx/$d.ssrdump" --profile "$fx/profile.toml" \
              --out "$RUNNER_TEMP/$d-ref.wav" --report "$RUNNER_TEMP/$d-ref.json"
            # shared-warm keeps the endpoint running with a silent shared
            # stream, as other apps do on a desktop; shared starts it cold.
            for run in exclusive shared shared-warm; do
              mode=${run%-warm}
              warm=()
              if [ "$run" = shared-warm ]; then warm=(--warm); fi
              s="$RUNNER_TEMP/loopback-$d-$run.json"
              python tools/ci/loopback_check.py --ssr-live target/release/ssr-live.exe \
                --dump "$fx/$d.ssrdump" --profile "$fx/profile.toml" \
                --reference "$RUNNER_TEMP/$d-ref.wav" --mode "$mode" "${warm[@]}" --period-ms 20 --summary "$s" \
                --report "$RUNNER_TEMP/loopback-$d-$run-report.json" || status=1
              if [ -f "$s" ]; then
                jq -r --arg d "$d" '"| \($d) | \(.mode) | \(.windows) | \(.matched) | \(.resyncs) | \(.median_correlation) | \(.worst_correlation) | \(.underruns_while_streaming) | \(.output_restarts) | \(.offset_s) s | \(.first_sound_s) s |"' "$s" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          done
          exit $status

      # Speaker output (ADR 0030). A profile whose speakers sit exactly at a
      # PCM layout's positions routes source channel k to device channel k,
      # so each channel's own tone must come back on its own channel through
      # the cable, matching the offline render and 40 dB above the others.
      # The layout is the widest of 8, 6, 4 channels both cable ends take in
      # exclusive mode; exit 2 means the cable took none of them.
      - name: Multichannel loopback (speaker profile through VB-CABLE; tools/ci/multichannel_loopback_check.py)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          python -m pip install --quiet -r tools/ci/requirements.txt
          cargo build --locked --release -p ssr-sys --example format_probe --example cable_capture || exit 1
          out="$RUNNER_TEMP/multichannel"
          python tools/ci/multichannel_loopback_check.py \
            --format-probe target/release/examples/format_probe.exe \
            --cable-capture target/release/examples/cable_capture.exe \
            --ssr-live target/release/ssr-live.exe --ssr-replay target/release/ssr-replay.exe \
            --work "$out" --summary "$out/summary.json"
          status=$?
          {
            echo "## Multichannel loopback (${{ matrix.os }})"
            echo
            if [ -f "$out/summary.json" ]; then
              jq -r '"channels \(.selected_channels), mode \(.mode), passed \(.passed)"' "$out/summary.json"
              jq -r '(.problems // [])[] | "- \(.)"' "$out/summary.json"
              jq -r '.reason // empty' "$out/summary.json"
            else
              echo "no summary"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" = 2 ]; then
            echo "::error::VB-CABLE took no 4, 6 or 8-channel layout in exclusive mode on both ends"
          fi
          exit $status

      # Kernel streaming (ADR 0037). The cable's render endpoint is disabled
      # while ssr-live writes its KS pin directly, and must be enabled again
      # afterwards. VB-CABLE is WaveCyclic, so this is the standard-streaming
      # transport; driver.yml runs the WaveRT transport against our own
      # endpoint. ks-probe plays a 1 kHz tone at -12 dBFS for 3 s that
      # cable_capture records at the far end (it wants at least 2 s of signal
      # per ear, so a 2 s probe minus its start latency fell short); the loopback renders the fixtures through the
      # whole engine and compares the far end with the offline render, and its
      # report must say kernel_streaming without a fallback to WASAPI.
      - name: Kernel streaming (VB-CABLE's render pin with its endpoint disabled)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          python -m pip install --quiet -r tools/ci/requirements.txt soundcard==0.4.5
          status=0
          ks="$RUNNER_TEMP/ks"
          mkdir -p "$ks"
          target/release/ssr-live.exe devices --kernel || status=1
          cargo build --locked --release -p ssr-sys --example cable_capture || exit 1
          target/release/examples/cable_capture.exe --endpoint "CABLE Output" --seconds 6 "$ks/probe-captured.wav" &
          capture=$!
          sleep 1
          target/release/ssr-live.exe ks-probe --output "VB-Audio Virtual Cable" --seconds 3 --json "$ks/probe.json" || status=1
          wait $capture || status=1
          python tools/ci/ks_probe_check.py "$ks/probe.json" --interface standard --captured "$ks/probe-captured.wav" || status=1
          fx="$RUNNER_TEMP/fx"
          {
            echo "## Kernel streaming (${{ matrix.os }})"
            echo
            jq -r '"probe: opened \(.opened), \(.interface), \(.sample_format), endpoint restored \(.endpoint_restored)"' "$ks/probe.json" 2>/dev/null || echo "probe: no report"
            echo
            echo "| dump | windows | matched | median | worst | underruns while streaming | restarts |"
            echo "| --- | --- | --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for d in pcm71 ddp51; do
            s="$ks/loopback-$d.json"
            python tools/ci/loopback_check.py --ssr-live target/release/ssr-live.exe \
              --dump "$fx/$d.ssrdump" --profile "$fx/profile.toml" \
              --reference "$RUNNER_TEMP/$d-ref.wav" --mode kernel_streaming --summary "$s" \
              --report "$ks/loopback-$d-report.json" || status=1
            if [ -f "$s" ]; then
              jq -r --arg d "$d" '"| \($d) | \(.windows) | \(.matched) | \(.median_correlation) | \(.worst_correlation) | \(.underruns_while_streaming) | \(.output_restarts) |"' "$s" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          # Every run must have given the endpoint back: `devices --json` lists
          # active render endpoints only. The cable's render endpoint is
          # "CABLE Input" on some images and "Speakers" on windows-2025; the
          # device part of the name is the same on both.
          target/release/ssr-live.exe devices --json > "$ks/devices-after.json" || status=1
          if jq -e 'any(.[]; .name | contains("VB-Audio Virtual Cable"))' "$ks/devices-after.json" > /dev/null; then
            echo "the cable's render endpoint is active again"
          else
            echo "::error::the cable's render endpoint is not active after the kernel-streaming runs"
            status=1
          fi
          exit $status

      - name: Soaks (exclusive 5 min, exclusive at 10 ms 2 min, shared 2 min, DD+ 2 min, exclusive under CPU load 2 min, under full page heap 1 min)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $fx = Join-Path $env:RUNNER_TEMP 'fx'
          $live = 'target/release/ssr-live.exe'
          Add-Content $env:GITHUB_STEP_SUMMARY "`n## Soaks (${{ matrix.os }})`n"
          Add-Content $env:GITHUB_STEP_SUMMARY '| soak | ran | underruns | restarts | latency p50 / p99 | ring trough | clock | verdict |'
          Add-Content $env:GITHUB_STEP_SUMMARY '| --- | --- | --- | --- | --- | --- | --- | --- |'
          $failed = @()
          $soaks = @(
            @{ Name = 'exclusive'; Minutes = 5; PeriodMs = 20 },
            @{ Name = 'exclusive-10ms'; Minutes = 2; PeriodMs = 10 },
            @{ Name = 'shared'; Minutes = 2; Shared = $true },
            @{ Name = 'ddp-exclusive'; Minutes = 2; Dump = 'ddp51'; PeriodMs = 20 },
            @{ Name = 'cpu-load'; Minutes = 2; CpuLoad = $true; PeriodMs = 20 },
            @{ Name = 'page-heap'; Minutes = 1; PageHeap = $true; PeriodMs = 20 }
          )
          foreach ($s in $soaks) {
            try {
              ./tools/ci/soak.ps1 -SsrLive $live -Fixtures $fx @s
            } catch {
              Write-Host "::error::$($_.Exception.Message)"
              $failed += $s.Name
            }
          }
          if ($failed) { throw "failed soaks: $($failed -join ', ')" }

      - name: Start and stop 60 times (exclusive and shared, half under CPU load; tools/ci/restart-stress.ps1)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: >-
          ./tools/ci/restart-stress.ps1 -SsrLive target/release/ssr-live.exe
          -Fixtures (Join-Path $env:RUNNER_TEMP 'fx') -Symbols (Resolve-Path target/release).Path

      # The ASIO entrance (ADR 0025). asio_probe loads the DLL the release
      # ships the way a DAW does (DllGetClassObject, IASIO, buffers, start)
      # and counts its callbacks; tools/ci/asio_probe_check.py judges each run.
      # 1. The DLL alone: its stand-in clock keeps the callbacks at the rate's
      #    pace and nothing takes the frames.
      # 2. ssr-live first, the DAW joining: the engine takes the frames on the
      #    cable's clock, and the DLL never falls back to its own.
      # 3. The DAW first, ssr-live joining and then killed: the engine takes
      #    frames while it lives and the callbacks keep their pace throughout.
      # This runs last of the device stages, after the soaks, so the killed
      # engine cannot disturb them.
      - name: ASIO entrance (ssrasio.dll loaded as a DAW does, fed into ssr-live)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          status=0
          asio="$RUNNER_TEMP/asio"
          mkdir -p "$asio/dll"
          # The probe's feature also builds the probe into the library, so the
          # DLL under test is the plain build, copied aside first.
          cargo build --locked --release -p ssr-asio || exit 1
          cp target/release/ssrasio.dll "$asio/dll/ssrasio.dll"
          cargo build --locked --release -p ssr-asio --features probe --example asio_probe || exit 1
          dll="$asio/dll/ssrasio.dll"
          probe=target/release/examples/asio_probe.exe
          python -m pip install --quiet pefile==2024.8.26
          python - "$dll" <<'EOF' || status=1
          import sys
          import pefile
          pe = pefile.PE(sys.argv[1])
          names = {symbol.name.decode() for symbol in pe.DIRECTORY_ENTRY_EXPORT.symbols if symbol.name}
          print("exports:", ", ".join(sorted(names)))
          missing = sorted({"DllGetClassObject", "DllCanUnloadNow"} - names)
          sys.exit(f"ssrasio.dll does not export {missing}" if missing else 0)
          EOF
          live=(target/release/ssr-live.exe play --asio --silence --profile "$RUNNER_TEMP/fx/profile.toml" --output "VB-Audio Virtual Cable")

          echo "::group::1. the DLL alone"
          "$probe" "$dll" --seconds 3 --json "$asio/alone.json" || status=1
          python tools/ci/asio_probe_check.py "$asio/alone.json" --engine absent || status=1
          echo "::endgroup::"

          echo "::group::2. ssr-live first, the DAW joining"
          "${live[@]}" --seconds 12 --report "$asio/engine-first-report.json" > "$asio/engine-first.log" 2>&1 &
          engine=$!
          sleep 3
          "$probe" "$dll" --seconds 5 --json "$asio/engine-first.json" || status=1
          wait $engine || { echo "::error::ssr-live failed with the DAW attached"; cat "$asio/engine-first.log"; status=1; }
          python tools/ci/asio_probe_check.py "$asio/engine-first.json" --engine attached --no-clock-fault || status=1
          echo "::endgroup::"

          echo "::group::3. the DAW first, ssr-live joining and then killed"
          "$probe" "$dll" --seconds 10 --json "$asio/daw-first.json" &
          daw=$!
          sleep 2
          "${live[@]}" --seconds 60 > "$asio/daw-first.log" 2>&1 &
          sleep 5
          taskkill //F //IM ssr-live.exe || status=1
          wait $daw || status=1
          python tools/ci/asio_probe_check.py "$asio/daw-first.json" --engine attached || status=1
          echo "::endgroup::"

          {
            echo "## ASIO entrance (${{ matrix.os }})"
            echo
            echo "| run | accepted | callbacks | rate | frames | channels | loaded | completed | stand-in clock | resets |"
            echo "| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |"
            for run in alone engine-first daw-first; do
              jq -r --arg run "$run" '"| \($run) | \(.accepted) | \(.callbacks) | \(.sample_rate) | \(.buffer_frames) | \(.output_channels) | \(.loaded_frames) | \(.completed_frames) | \(.clock_fault_observed) | \(.reset_requests) |"' "$asio/$run.json" 2>/dev/null \
                || echo "| $run | no report | | | | | | | | |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Crash stacks (cdb on any dump)
        if: always()
        shell: pwsh
        run: ./tools/ci/crash-dumps.ps1 -Folder (Join-Path $env:RUNNER_TEMP 'dumps') -Report -Symbols (Resolve-Path target/release).Path

      - name: Keep the reports, dumps and symbols
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audio-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/loopback-*.json
            ${{ runner.temp }}/multichannel
            ${{ runner.temp }}/ks
            ${{ runner.temp }}/soak-*.json
            ${{ runner.temp }}/soak-*.log
            ${{ runner.temp }}/dumps
            ${{ runner.temp }}/asio/*.json
            ${{ runner.temp }}/asio/*.log
            target/release/ssr_live.pdb
            target/release/ssr_replay.pdb
            target/release/ssrasio.pdb
          if-no-files-found: ignore
          retention-days: 14

  plughost:
    name: plugin host (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-toolchain
        with:
          cache-key: plughost

      - name: Build the plugin host and the test plugin
        shell: bash
        run: cargo build --locked -p ssr-plughost -p plughost-testplugin

      # The third-party upmixer is x64 only and is not open source: it stays
      # in $RUNNER_TEMP, outside the checkout and the cache, and nothing
      # uploads it (tools/ci/private/README.md). Without the secret (forks)
      # the path is empty and its test skips itself.
      - name: Decrypt the third-party test upmixer (x64, needs the secret)
        id: third_party
        if: runner.arch == 'X64'
        shell: bash
        env:
          UPMIX_PLUGIN_KEY: ${{ secrets.UPMIX_PLUGIN_KEY }}
        run: ./tools/ci/private/decrypt-upmix-plugin.sh

      # One test at a time: each one starts, kills and restarts host
      # processes, and the crash test counts failures over wall-clock time.
      # The same test DLL carries both entry points; the VST 3 copy only
      # needs the bundle-less .vst3 name.
      - name: Plugin host end to end (ignored tests)
        shell: bash
        env:
          SSR_THIRD_PARTY_VST3: ${{ steps.third_party.outputs.path }}
        run: |
          set -euo pipefail
          export SSR_PLUGHOST_EXE="$PWD/target/debug/ssr-plughost.exe"
          export SSR_TEST_PLUGIN_VST2="$PWD/target/debug/ssr_testplugin.dll"
          export SSR_TEST_PLUGIN_VST3="$PWD/target/debug/ssr_testplugin.vst3"
          cp "$SSR_TEST_PLUGIN_VST2" "$SSR_TEST_PLUGIN_VST3"
          test -f "$SSR_PLUGHOST_EXE"
          if [ -z "$SSR_THIRD_PARTY_VST3" ]; then unset SSR_THIRD_PARTY_VST3; fi
          cargo test --locked -p plughost --test windows -- --ignored --test-threads=1

      - name: Remove the decrypted third-party upmixer
        if: always() && runner.arch == 'X64'
        shell: bash
        run: rm -rf "$RUNNER_TEMP/upmix-plugin"

  # The Velopack installer's whole life on a clean runner (app.installer):
  # Setup.exe installs 0.0.1 silently, the installed app updates itself to
  # 0.0.2 from a local feed (SSR_UPDATE_SOURCE, test only) through its hidden
  # --update-once, and Update.exe uninstalls it. The cycle runs as a
  # standard local user, as people install it: the runner's own account is
  # an administrator and tools/ci/installer_cycle.ps1 refuses one. Both
  # versions are packed from this commit's build; only the version differs.
  installer:
    name: installer install, update and uninstall (windows-2025)
    needs: lint
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-toolchain
        with:
          cache-key: installer

      - uses: ./.github/actions/ui-dist

      - name: Build the app, the guard, the setup tool and the plugin host
        run: cargo build --release --locked -p spatial-softreceiver --features spatial-softreceiver/updater -p ssr-guard -p ssr-setup -p ssr-plughost -p ssr-asio

      - name: Stage the app folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force stage/profiles | Out-Null
          Copy-Item target/release/spatial-softreceiver.exe, target/release/ssr-guard.exe, target/release/ssr-setup.exe, target/release/ssr-plughost.exe, LICENSE stage/
          # The same app folder as release.yml stages, the ASIO DLL included.
          Copy-Item target/release/ssrasio.dll stage/
          Copy-Item crates/asio-sys/LICENSE stage/LICENSE-GPL-3.0.txt
          Copy-Item apps/spatial-softreceiver/icons/icon.ico stage/spatial-softreceiver.ico
          Copy-Item docs/profiles/*.toml stage/profiles/

      - name: Install vpk
        run: dotnet tool install -g vpk

      # The same flags as release.yml's app-installer job.
      - name: Pack 0.0.1 and 0.0.2 into one local feed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cycle = 'C:\ssr-cycle'
          New-Item -ItemType Directory -Force "$cycle\releases", "$cycle\old" | Out-Null
          foreach ($version in '0.0.1', '0.0.2') {
            vpk pack --packId SpatialSoftReceiver --packVersion $version --packDir stage `
              --mainExe spatial-softreceiver.exe --packTitle 'Spatial SoftReceiver' --packAuthors 115dkk `
              --icon apps/spatial-softreceiver/icons/icon.ico --shortcuts StartMenuRoot `
              --aumid io.github.115dkk.spatial-softreceiver --noPortable --outputDir "$cycle\releases"
            if ($LASTEXITCODE -ne 0) { throw "vpk pack $version failed ($LASTEXITCODE)" }
            if ($version -eq '0.0.1') {
              $setup = Get-ChildItem "$cycle\releases" -Filter '*Setup.exe' | Select-Object -First 1
              if (-not $setup) { throw 'vpk pack wrote no Setup.exe' }
              Move-Item $setup.FullName "$cycle\old\Setup.exe"
            }
          }
          Copy-Item tools/ci/installer_cycle.ps1 $cycle
          Get-ChildItem -Recurse $cycle | Format-Table FullName, Length

      - name: Install, update and uninstall as a standard user (tools/ci/installer_cycle.ps1)
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $cycle = 'C:\ssr-cycle'
          $user = 'ssrcycle'
          $password = ConvertTo-SecureString ("Aa1!" + [guid]::NewGuid().ToString('N')) -AsPlainText -Force
          New-LocalUser -Name $user -Password $password -PasswordNeverExpires -UserMayNotChangePassword | Out-Null
          Add-LocalGroupMember -Group 'Users' -Member $user
          # vpk writes each package in the runner account's temp folder and
          # moves it here, so the files keep that folder's ACL; reset them to
          # inherit from the cycle folder, then grant the account on it.
          icacls $cycle /reset /T /C /Q | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "icacls /reset failed ($LASTEXITCODE)" }
          icacls $cycle /grant "${user}:(OI)(CI)M" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "icacls /grant failed ($LASTEXITCODE)" }
          $credential = [pscredential]::new("$env:COMPUTERNAME\$user", $password)
          $pwsh = (Get-Command pwsh).Source
          $arguments = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "$cycle\installer_cycle.ps1",
            '-Releases', "$cycle\releases", '-Setup', "$cycle\old\Setup.exe",
            '-OldVersion', '0.0.1', '-NewVersion', '0.0.2', '-Summary', "$cycle\installer-cycle.json")
          $process = Start-Process -FilePath $pwsh -ArgumentList $arguments -Credential $credential -LoadUserProfile `
            -WorkingDirectory $cycle -RedirectStandardOutput "$cycle\cycle.out.log" -RedirectStandardError "$cycle\cycle.err.log" `
            -Wait -PassThru
          Get-Content "$cycle\cycle.out.log", "$cycle\cycle.err.log" -ErrorAction SilentlyContinue
          if (Test-Path "$cycle\installer-cycle.json") { Get-Content "$cycle\installer-cycle.json" }
          if ($process.ExitCode -ne 0) { throw "installer_cycle.ps1 exited $($process.ExitCode)" }

      - name: Keep the cycle's summary and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: installer-cycle
          path: |
            C:\ssr-cycle\installer-cycle.json
            C:\ssr-cycle\cycle.*.log
            C:\ssr-cycle\update-once-*.json
            C:\ssr-cycle\uninstall-hook-*.log
          if-no-files-found: ignore

  docs:
    name: rustdoc (deny warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-toolchain
        with:
          cache-key: docs

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --locked

      - uses: ./.github/actions/ui-dist
      - uses: ./.github/actions/windows-cross-tools

      - name: cargo doc for the Windows target (the cfg(windows) modules)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo doc --workspace --no-deps --document-private-items --locked --target x86_64-pc-windows-msvc

  miri:
    name: Miri (parsing crates)
    runs-on: ubuntu-latest
    env:
      # proptest keeps its regression file on disk; Miri isolation would refuse it.
      MIRIFLAGS: -Zmiri-disable-isolation
      PROPTEST_CASES: "16"
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly with Miri
        run: |
          rustup toolchain install nightly --profile minimal --component miri,rust-src
          cargo +nightly miri setup

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: miri

      - name: cargo miri test
        run: cargo +nightly miri test --locked -p ssr-types -p ssr-abi --lib

  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: ssr-abi
            target: records
          - crate: ssr-abi
            target: dump
          - crate: bitstream
            target: deframer
          - crate: decode
            target: pcm
          - crate: decode
            target: ddp
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz
          workspaces: crates/${{ matrix.crate }}/fuzz

      - name: cargo fuzz run (120 s)
        working-directory: crates/${{ matrix.crate }}
        # cargo-fuzz from install-action is a static musl build, which would
        # otherwise make musl its default target.
        run: >-
          cargo +nightly fuzz run ${{ matrix.target }}
          --target x86_64-unknown-linux-gnu -- -max_total_time=120

      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.crate }}-${{ matrix.target }}
          path: crates/${{ matrix.crate }}/fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14

  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-toolchain
        with:
          cache-key: coverage
          components: llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Measure
        run: |
          cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
          {
            echo "## Line coverage"
            echo
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info
          retention-days: 14

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # deny.toml excuses the zip advisories only while the newest velopack
      # cannot be built with a patched zip; this proves it on every run.
      # When zip-advisory-guard.yml removes the exception it deletes the
      # script, which turns this step off.
      - name: The zip advisory exception still stands
        if: hashFiles('.github/scripts/velopack_zip_guard.py') != ''
        run: python3 .github/scripts/velopack_zip_guard.py check

      - name: cargo deny check
        run: cargo deny --all-features check

  # asio-sys carries the SDK's definitions by hand (ADR 0025); the SDK itself
  # never enters the repository. This downloads the pinned archive into an
  # empty folder and compares those definitions with its headers without
  # extracting or compiling anything (tools/ci/check-asio-sdk.py).
  asio-sdk:
    name: ASIO SDK definitions match the pinned SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download the pinned SDK and compare
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/asio-sdk"
          mkdir -p "$sdk"
          url=$(python3 -I -c 'import ast, sys; tree = ast.parse(open(sys.argv[1], encoding="utf-8").read()); print(next(node.value.value for node in tree.body if isinstance(node, ast.Assign) and node.targets[0].id == "URL"))' tools/ci/check-asio-sdk.py)
          sha=$(python3 -I -c 'import ast, sys; tree = ast.parse(open(sys.argv[1], encoding="utf-8").read()); print(next(node.value.value for node in tree.body if isinstance(node, ast.Assign) and node.targets[0].id == "SHA256"))' tools/ci/check-asio-sdk.py)
          curl --fail --location --retry 4 --retry-delay 5 --max-filesize 33554432 -o "$sdk/sdk.zip" "$url"
          python3 -I tools/ci/check-asio-sdk.py --archive "$sdk/sdk.zip" --sha256 "$sha"
